<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forgot Password — EMF Insight</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #111827;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            line-height: 1.5;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Forgot password?</h1>

        <p class="subtitle">
            Enter your email address and we'll send you instructions
            to reset your password.
        </p>

        <form id="forgotPasswordForm">

            <label for="email">Email</label>

            <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />

            <button id="submitButton" type="submit">
                Send reset link
            </button>

        </form>

        <div id="message" class="message"></div>

        <a class="back" href="login.html">
            ← Back to login
        </a>

    </div>

    <script>
        const API = "https://emf-insight.onrender.com";

        const form = document.getElementById(
            "forgotPasswordForm"
        );

        const emailInput = document.getElementById(
            "email"
        );

        const submitButton = document.getElementById(
            "submitButton"
        );

        const message = document.getElementById(
            "message"
        );

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const email = emailInput.value.trim();

                if (!email) {
                    return;
                }

                submitButton.disabled = true;
                message.textContent = "Please wait...";

                try {

                    const response = await fetch(
                        `${API}/forgot-password?email=${encodeURIComponent(email)}`,
                        {
                            method: "POST"
                        }
                    );

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.detail ||
                            "Unable to process request."
                        );
                    }

                    message.textContent =
                        "If an account exists for this email, password reset instructions will be sent.";

                    form.reset();

                } catch (error) {

                    message.textContent =
                        error.message ||
                        "Something went wrong.";

                } finally {

                    submitButton.disabled = false;

                }

            }
        );
    </script>

</body>

</html>
