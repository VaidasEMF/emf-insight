<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in | EMF Insight</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f5f7f9;
            color: #17202a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-shell {
            width: 100%;
            max-width: 440px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-name {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            margin-top: 6px;
            font-size: 14px;
            color: #6b7280;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 36px;
            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.06);
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.2;
            letter-spacing: -0.6px;
        }

        .intro {
            margin: 10px 0 28px;
            color: #6b7280;
            font-size: 15px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #ffffff;
            color: #111827;
            font-size: 15px;
            outline: none;
            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        input:focus {
            border-color: #64748b;
            box-shadow:
                0 0 0 3px rgba(100, 116, 139, 0.12);
        }

        .password-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }

        .password-row label {
            margin-bottom: 0;
        }

        .forgot-link {
            font-size: 13px;
            color: #475569;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: #17202a;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition:
                background 0.15s ease,
                transform 0.05s ease;
        }

        button:hover {
            background: #273444;
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .signup {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        .signup a {
            color: #17202a;
            font-weight: 600;
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }

        @media (max-width: 520px) {

            body {
                padding: 16px;
            }

            .card {
                padding: 28px 22px;
                border-radius: 14px;
            }

            h1 {
                font-size: 25px;
            }

        }
    </style>

</head>

<body>

    <main class="auth-shell">

        <div class="brand">

            <div class="brand-name">
                EMF Insight
            </div>

            <div class="brand-subtitle">
                Environmental EMF assessment platform
            </div>

        </div>


        <section class="card">

            <h1>
                Welcome back
            </h1>

            <p class="intro">
                Sign in to continue to your EMF Insight account.
            </p>


            <form id="loginForm">

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>

                </div>


                <div class="field">

                    <div class="password-row">

                        <label for="password">
                            Password
                        </label>

                        <a class="forgot-link" href="forgot-password.html">
                            Forgot password?
                        </a>

                    </div>

                    <input id="password" type="password" autocomplete="current-password"
                        placeholder="Enter your password" required>

                </div>


                <button id="loginButton" type="submit">
                    Sign in
                </button>

                <div id="message" class="message"></div>

            </form>


            <div class="signup">

                Don't have an account?

                <a href="register.html">
                    Create account
                </a>

            </div>

        </section>


        <div class="footer">
            © 2026 EMF Insight
        </div>

    </main>


    <script>

        const API =
            "https://emf-insight.onrender.com";


        const form =
            document.getElementById(
                "loginForm"
            );

        const button =
            document.getElementById(
                "loginButton"
            );

        const message =
            document.getElementById(
                "message"
            );


        function showError(text) {

            message.textContent = text;

            message.className =
                "message error";
        }


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                message.className =
                    "message";

                button.disabled = true;

                button.textContent =
                    "Signing in...";


                const username =
                    document.getElementById(
                        "email"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "password"
                    ).value;


                try {

                    const formData =
                        new URLSearchParams();

                    formData.append(
                        "username",
                        username
                    );

                    formData.append(
                        "password",
                        password
                    );


                    const response =
                        await fetch(
                            `${API}/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/x-www-form-urlencoded"
                                },

                                body: formData
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        showError(
                            data.detail ||
                            "Unable to sign in. Please check your email and password."
                        );

                        return;
                    }


                    localStorage.setItem(
                        "token",
                        data.access_token
                    );

                    // Remember which workspace the user selected
                    const params = new URLSearchParams(
                        window.location.search
                    );

                    const requestedWorkspace =
                        params.get("workspace");

                    if (
                        requestedWorkspace === "home" ||
                        requestedWorkspace === "business"
                    ) {
                        sessionStorage.setItem(
                            "requestedWorkspace",
                            requestedWorkspace
                        );
                    }

                    window.location.href = "workspace.html";

                }

                catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    showError(
                        "Unable to connect to EMF Insight. Please try again."
                    );

                }

                finally {

                    button.disabled = false;

                    button.textContent =
                        "Sign in";

                }

            }
        );

    </script>

</body>

</html>
