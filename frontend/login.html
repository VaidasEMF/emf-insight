<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>EMF Login</title>

</head>

<body>

    <h2>Login</h2>

    <input id="email" placeholder="email">

    <input id="password" type="password" placeholder="password">

    <button onclick="login()">
        Login
    </button>

    <script>

        const API =
            "http://127.0.0.1:8000";

        async function login() {

            const username =
                document.getElementById(
                    "email"
                ).value;

            const password =
                document.getElementById(
                    "password"
                ).value;

            try {

                const formData =
                    new URLSearchParams();

                formData.append(
                    "username",
                    username
                );

                formData.append(
                    "password",
                    password
                );

                const res =
                    await fetch(

                        `${API}/login`,

                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body: formData
                        }
                    );

                const data =
                    await res.json();

                console.log(data);

                if (!res.ok) {

                    alert(
                        JSON.stringify(data)
                    );

                    return;
                }

                localStorage.setItem(
                    "token",
                    data.access_token
                );

                console.log("ACCESS TOKEN:", data.access_token);

                console.log(
                    "TOKEN FROM STORAGE:",
                    localStorage.getItem("token")
                );

                console.log(
                    "ORIGIN:",
                    window.location.origin
                );

                window.location.href =
                    "dashboard.html";

            }

            catch (err) {

                console.error(err);

                alert(
                    "Server error"
                );
            }
        }

    </script>

</body>

</html>
