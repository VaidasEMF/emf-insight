<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password — EMF Insight</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #111827;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #111827;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            line-height: 1.5;
        }

        .success {
            color: #166534;
        }

        .error {
            color: #b91c1c;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #555;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Reset password</h1>

        <p class="subtitle">
            Enter your new password below.
        </p>

        <form id="resetPasswordForm">

            <label for="password">
                New password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="new-password"
                required
                minlength="6"
            />

            <label for="confirmPassword">
                Confirm new password
            </label>

            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                required
                minlength="6"
            />

            <button
                id="submitButton"
                type="submit"
            >
                Reset password
            </button>

        </form>

        <div id="message" class="message"></div>

        <a class="back" href="login.html">
            ← Back to login
        </a>

    </div>


    <script>

        const API =
            "https://emf-insight.onrender.com";


        const form =
            document.getElementById(
                "resetPasswordForm"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const params =
            new URLSearchParams(
                window.location.search
            );


        const token =
            params.get("token");


        if (!token) {

            form.style.display = "none";

            message.textContent =
                "This password reset link is invalid or incomplete.";

            message.className =
                "message error";

        }


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                if (!token) {
                    return;
                }


                const password =
                    passwordInput.value;


                const confirmPassword =
                    confirmPasswordInput.value;


                if (password !== confirmPassword) {

                    message.textContent =
                        "The passwords do not match.";

                    message.className =
                        "message error";

                    return;
                }


                submitButton.disabled = true;

                message.textContent =
                    "Please wait...";

                message.className =
                    "message";


                try {

                    const response =
                        await fetch(
                            `${API}/reset-password?token=${encodeURIComponent(token)}&new_password=${encodeURIComponent(password)}`,
                            {
                                method: "POST"
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.detail ||
                            "Unable to reset your password."
                        );

                    }


                    form.style.display =
                        "none";


                    message.textContent =
                        "Your password has been reset successfully. You can now sign in.";

                    message.className =
                        "message success";


                }
                catch (error) {

                    message.textContent =
                        error.message ||
                        "Something went wrong.";

                    message.className =
                        "message error";

                }
                finally {

                    submitButton.disabled =
                        false;

                }

            }
        );

    </script>

</body>

</html>
