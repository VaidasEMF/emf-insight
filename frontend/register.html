<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — EMF Insight</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f5f7fa;
            color: #142033;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .page {
            width: 100%;
            max-width: 520px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-name {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #102033;
        }

        .brand-subtitle {
            margin-top: 8px;
            font-size: 15px;
            color: #718096;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e1e7ef;
            border-radius: 18px;

            padding: 38px 40px 36px;

            box-shadow:
                0 10px 30px rgba(20, 32, 51, 0.07);
        }

        h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.2;
            letter-spacing: -0.5px;
            color: #102033;
        }

        .intro {
            margin: 10px 0 30px;
            font-size: 16px;
            line-height: 1.5;
            color: #66758a;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;
            color: #24344d;
        }

        input {
            width: 100%;
            height: 54px;

            padding: 0 15px;

            border: 1px solid #cbd5e1;
            border-radius: 10px;

            background: #ffffff;

            font-size: 16px;
            color: #172033;

            outline: none;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        input::placeholder {
            color: #9aa7b8;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .password-help {
            margin-top: 7px;
            font-size: 12px;
            color: #7a8798;
            line-height: 1.4;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;

            margin: 4px 0 24px;

            font-size: 13px;
            line-height: 1.5;
            color: #68778b;
        }

        .terms input {
            width: 17px;
            height: 17px;

            flex: 0 0 auto;

            margin: 1px 0 0;
            padding: 0;

            accent-color: #2563eb;
        }

        .terms label {
            margin: 0;
            font-size: 13px;
            font-weight: 400;
            color: #68778b;
        }

        .terms a {
            color: #2563eb;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .button {
            width: 100%;
            height: 54px;

            border: none;
            border-radius: 10px;

            background: #17212b;
            color: #ffffff;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.05s ease;
        }

        .button:hover {
            background: #0f1720;
        }

        .button:active {
            transform: translateY(1px);
        }

        .button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-bottom: 20px;
            padding: 12px 14px;

            border-radius: 9px;

            font-size: 14px;
            line-height: 1.45;
        }

        .message.error {
            display: block;

            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #be123c;
        }

        .message.success {
            display: block;

            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        .divider {
            height: 1px;
            background: #e2e8f0;

            margin: 28px 0 24px;
        }

        .login-link {
            text-align: center;

            font-size: 14px;
            color: #68778b;
        }

        .login-link a {
            color: #17212b;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;

            margin-top: 26px;

            font-size: 13px;
            color: #8a98aa;
        }

        @media (max-width: 560px) {
            body {
                padding: 24px 16px;
            }

            .card {
                padding: 30px 24px;
            }

            .field-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- BRAND -->
        <div class="brand">
            <div class="brand-name">
                EMF Insight
            </div>

            <div class="brand-subtitle">
                Environmental EMF assessment platform
            </div>
        </div>


        <!-- CARD -->
        <div class="card">

            <h1>
                Create your EMF Insight account
            </h1>

            <p class="intro">
                Create an account to start your EMF assessment.
            </p>


            <!-- MESSAGE -->
            <div id="message" class="message"></div>


            <!-- FORM -->
            <form id="registerForm">

                <!-- FIRST + LAST NAME -->
                <div class="field-row">

                    <div class="field">
                        <label for="firstName">
                            First name
                        </label>

                        <input id="firstName" type="text" autocomplete="given-name" placeholder="Your first name"
                            required>
                    </div>


                    <div class="field">
                        <label for="lastName">
                            Last name
                        </label>

                        <input id="lastName" type="text" autocomplete="family-name" placeholder="Your last name"
                            required>
                    </div>

                </div>


                <!-- EMAIL -->
                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>

                </div>


                <!-- PASSWORD -->
                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input id="password" type="password" autocomplete="new-password" placeholder="Create a password"
                        minlength="8" required>

                    <div class="password-help">
                        Use at least 8 characters.
                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="field">

                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <input id="confirmPassword" type="password" autocomplete="new-password"
                        placeholder="Repeat your password" minlength="8" required>

                </div>


                <!-- TERMS -->
                <div class="terms">

                    <input id="terms" type="checkbox" required>

                    <label for="terms">
                        I agree to the EMF Insight
                        <a href="#" onclick="return false;">
                            Privacy Policy
                        </a>
                        and
                        <a href="#" onclick="return false;">
                            Terms of Use
                        </a>.
                    </label>

                </div>


                <!-- SUBMIT -->
                <button id="submitButton" class="button" type="submit">
                    Create account
                </button>

            </form>


            <!-- DIVIDER -->
            <div class="divider"></div>


            <!-- LOGIN -->
            <div class="login-link">
                Already have an account?
                <a href="login.html">
                    Sign in
                </a>
            </div>

        </div>


        <!-- FOOTER -->
        <div class="footer">
            © 2026 EMF Insight
        </div>

    </div>


    <script>

        const API = "https://emf-insight.onrender.com";

        const form =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");

        const submitButton =
            document.getElementById("submitButton");


        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                showMessage("", "");

                const firstName =
                    document.getElementById(
                        "firstName"
                    ).value.trim();

                const lastName =
                    document.getElementById(
                        "lastName"
                    ).value.trim();

                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "password"
                    ).value;

                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                // PASSWORD CHECK
                if (
                    password.length < 8
                ) {

                    showMessage(
                        "Password must contain at least 8 characters.",
                        "error"
                    );

                    return;
                }


                // PASSWORD MATCH
                if (
                    password !== confirmPassword
                ) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;
                }


                submitButton.disabled = true;

                submitButton.textContent =
                    "Creating account...";


                try {

                    const params =
                        new URLSearchParams({

                            first_name:
                                firstName,

                            last_name:
                                lastName,

                            email:
                                email,

                            password:
                                password

                        });


                    const response =
                        await fetch(
                            `${API}/register?${params.toString()}`,
                            {
                                method: "POST"
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.detail ||
                            "Unable to create account."
                        );

                    }


                    showMessage(
                        "Account created successfully. Redirecting to sign in...",
                        "success"
                    );


                    setTimeout(
                        function () {

                            window.location.href =
                                "login.html";

                        },
                        1200
                    );


                }
                catch (error) {

                    showMessage(
                        error.message ||
                        "Something went wrong. Please try again.",
                        "error"
                    );

                }
                finally {

                    submitButton.disabled =
                        false;

                    submitButton.textContent =
                        "Create account";

                }

            }
        );

    </script>

</body>

</html>
